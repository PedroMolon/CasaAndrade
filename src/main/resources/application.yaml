spring:
  application:
    name: CasaAndrade
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:casa-andrade-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

rsa:
  private-key: classpath:certs/app.key
  public-key: classpath:certs/app.pub

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:admin@casaandrade.com}
    password: ${ADMIN_SEED_PASSWORD:password123}